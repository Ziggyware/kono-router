<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nokey-router · API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #08090a; }
  .dark-mode {
    --scalar-font: "IBM Plex Mono", ui-monospace, monospace;
    --scalar-font-code: "IBM Plex Mono", ui-monospace, monospace;
    --scalar-radius: 0; --scalar-radius-lg: 0; --scalar-radius-xl: 0;
    --scalar-color-1: #e8eadf; --scalar-color-2: #a3a79a; --scalar-color-3: #6b6f63;
    --scalar-color-accent: #d4ff00;
    --scalar-background-1: #08090a; --scalar-background-2: #0e1011;
    --scalar-background-3: #15181a; --scalar-background-accent: #d4ff0014;
    --scalar-border-color: #1f2326;
    --scalar-button-1: #d4ff00; --scalar-button-1-color: #08090a; --scalar-button-1-hover: #b8de00;
    --scalar-color-green: #d4ff00; --scalar-color-blue: #7cc4ff; --scalar-color-orange: #ffb547;
    --scalar-color-red: #ff5c5c; --scalar-color-yellow: #e8d44d; --scalar-color-purple: #c79bff;
  }
  .dark-mode .t-doc__sidebar { --scalar-sidebar-background-1: #08090a; --scalar-sidebar-item-active-background: #d4ff0014; --scalar-sidebar-color-active: #d4ff00; --scalar-sidebar-border-color: #1f2326; }
</style>
</head>
<body>
<div id="ref"></div>
<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.76.4"></script>
<script>
  Scalar.createApiReference("#ref", {
    url: "/openapi.json",
    servers: [{ url: location.origin }],
    theme: "none",
    forceDarkModeState: "dark",
    hideDarkModeToggle: true,
    withDefaultFonts: false,
    defaultHttpClient: { targetKey: "js", clientKey: "fetch" },
    authentication: { preferredSecurityScheme: [["bearerAuth", "adminSecret"]] },
    persistAuth: true,
    showDeveloperTools: "never",
    agent: { disabled: true },
  });
</script>
</body>
</html>
