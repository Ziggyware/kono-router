<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nokey-router</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root { --bg:#08090a; --bg2:#0e1011; --bg3:#15181a; --line:#1f2326; --line2:#2a2f33; --fg:#e8eadf; --mid:#a3a79a; --dim:#6b6f63; --acc:#d4ff00; --acc2:#d4ff0018; --bad:#ff5c5c; --warn:#ffb547; --blue:#7cc4ff; --vio:#c79bff; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:12px/1.5 "IBM Plex Mono",ui-monospace,monospace; }
body { display:flex; flex-direction:column; overflow:hidden; }
::selection { background:var(--acc); color:var(--bg); }
::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:var(--line2); } ::-webkit-scrollbar-track { background:transparent; }
a { color:var(--mid); }
button,input,select,textarea { font:inherit; color:var(--fg); }
input,select,textarea { background:var(--bg2); border:1px solid var(--line); padding:5px 8px; min-width:0; }
textarea { resize:vertical; }
input:focus,select:focus,textarea:focus,button:focus-visible { outline:1px solid var(--acc); outline-offset:-1px; }
.btn { background:var(--bg2); border:1px solid var(--line); color:var(--acc); padding:5px 10px; cursor:pointer; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }
.btn:hover { border-color:var(--acc); }
.btn:disabled { color:var(--dim); border-color:var(--line); cursor:default; }
.btn.q { color:var(--mid); }
.btn.on { background:var(--acc2); border-color:var(--acc); }
.in { width:100%; }
.box { border:1px solid var(--line); }
.dim { color:var(--dim); } .mid { color:var(--mid); } .acc { color:var(--acc); } .ok { color:var(--acc); } .no { color:var(--bad); } .warn { color:var(--warn); }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.grow { flex:1; }
.lbl { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
pre { margin:0; padding:10px; border:1px solid var(--line); background:var(--bg2); overflow:auto; white-space:pre; tab-size:2; }
pre.wrap { white-space:pre-wrap; word-break:break-word; }

/* shell */
header { display:flex; align-items:stretch; border-bottom:1px solid var(--line); min-height:38px; flex-shrink:0; }
nav { display:flex; overflow-x:auto; scrollbar-width:none; }
nav::-webkit-scrollbar { display:none; }
nav .sep { width:1px; background:var(--line); margin:9px 6px; flex-shrink:0; }
nav button { border:0; border-bottom:1px solid transparent; background:none; color:var(--dim); padding:0 10px; cursor:pointer; text-transform:uppercase; letter-spacing:.08em; white-space:nowrap; }
nav button:hover { color:var(--mid); }
nav button[aria-selected=true] { color:var(--acc); border-color:var(--acc); }
#conn { display:flex; align-items:center; gap:8px; padding:0 12px; border:0; border-left:1px solid var(--line); background:none; cursor:pointer; color:var(--mid); white-space:nowrap; }
#conn i { width:7px; height:7px; background:var(--dim); display:inline-block; }
#conn i.ok { background:var(--acc); } #conn i.no { background:var(--bad); }
#kbtn { border:0; border-left:1px solid var(--line); background:none; color:var(--dim); padding:0 12px; cursor:pointer; }
main { flex:1; min-height:0; position:relative; }
.view { position:absolute; inset:0; overflow:auto; padding:12px; }
.view[hidden] { display:none !important; }
.view.full { padding:0; display:flex; overflow:hidden; }

/* tables, kpis */
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th,td { padding:3px 8px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line); }
th { color:var(--dim); font-weight:400; text-transform:uppercase; font-size:10px; letter-spacing:.06em; position:sticky; top:0; background:var(--bg); }
th[data-k] { cursor:pointer; }
td:first-child,th:first-child,td.l,th.l { text-align:left; }
td.t { max-width:44ch; overflow:hidden; text-overflow:ellipsis; }
tbody tr:hover td { background:var(--bg2); }
tbody tr.click { cursor:pointer; }
tr.x td { white-space:normal; color:var(--mid); text-align:left; }
.kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); border:1px solid var(--line); margin-bottom:12px; }
.kpi { padding:8px 10px; border-right:1px solid var(--line); }
.kpi b { display:block; font-size:18px; font-weight:500; color:var(--acc); font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; }
.kpi span { color:var(--dim); text-transform:uppercase; font-size:10px; letter-spacing:.08em; }
.kpi i { font-style:normal; color:var(--mid); font-size:10px; margin-left:4px; }
.lane { border:1px solid var(--line); margin-bottom:12px; }
.lane h3 { margin:0; padding:6px 10px; border-bottom:1px solid var(--line); font-size:11px; font-weight:500; color:var(--acc); text-transform:uppercase; letter-spacing:.1em; }
.plots { display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line); }
.plots canvas { width:100%; height:140px; display:block; }
.plots canvas + canvas { border-left:1px solid var(--line); }
.sw { display:inline-block; width:8px; height:8px; margin-right:6px; }

/* chat */
.chat { flex:1; display:flex; flex-direction:column; min-width:0; }
#thread { flex:1; overflow:auto; padding:16px 0 24px; }
.msg { max-width:920px; margin:0 auto 14px; padding:0 16px; }
.msg.u .body { border-left:1px solid var(--acc); padding:6px 12px; background:var(--bg2); white-space:pre-wrap; word-break:break-word; }
.msg.u img { max-height:160px; border:1px solid var(--line); display:block; margin-bottom:6px; }
.msg.t .body { border-left:1px solid var(--vio); padding:4px 12px; color:var(--mid); white-space:pre-wrap; word-break:break-word; }
.meta { color:var(--dim); font-size:11px; margin-bottom:4px; display:flex; gap:12px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
.meta b { color:var(--mid); font-weight:400; }
.meta .live { color:var(--acc); }
.meta .live::after { content:"▍"; animation:blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity:0; } }
details.rs { border-left:1px solid var(--line2); margin:0 0 8px; }
details.rs summary { cursor:pointer; color:var(--dim); padding:2px 10px; list-style:none; user-select:none; }
details.rs summary::-webkit-details-marker { display:none; }
details.rs summary::before { content:"▸ "; }
details.rs[open] summary::before { content:"▾ "; }
details.rs .rb { padding:2px 12px 6px; color:var(--mid); white-space:pre-wrap; word-break:break-word; max-height:40vh; overflow:auto; font-size:11.5px; }
.md { line-height:1.62; word-break:break-word; }
.md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
.md p,.md ul,.md ol,.md blockquote,.md table { margin:0 0 10px; }
.md h1,.md h2,.md h3,.md h4 { font-size:13px; color:var(--acc); margin:14px 0 6px; font-weight:600; }
.md code { background:var(--bg3); padding:1px 4px; }
.md pre { position:relative; margin:0 0 10px; padding:10px 12px; }
.md pre code { background:none; padding:0; }
.md pre .cp { position:absolute; top:4px; right:4px; opacity:0; }
.md pre:hover .cp { opacity:1; }
.md blockquote { border-left:1px solid var(--line2); padding-left:10px; color:var(--mid); }
.md table td,.md table th { text-align:left; white-space:normal; border:1px solid var(--line); }
.md a { color:var(--acc); }
.md img { max-width:100%; }
.hljs-keyword,.hljs-selector-tag,.hljs-built_in { color:var(--acc); } .hljs-string,.hljs-attr { color:#b9d98c; } .hljs-number,.hljs-literal { color:var(--warn); }
.hljs-comment { color:var(--dim); font-style:italic; } .hljs-title,.hljs-function { color:var(--blue); } .hljs-type,.hljs-class { color:var(--vio); } .hljs-meta,.hljs-variable { color:var(--mid); }
.tcalls { display:grid; gap:6px; margin:8px 0; }
.tc { border:1px solid var(--line); border-left:1px solid var(--vio); }
.tc .h { display:flex; gap:10px; padding:4px 10px; border-bottom:1px solid var(--line); }
.tc .h b { color:var(--vio); font-weight:500; }
.tc pre { border:0; margin:0; padding:6px 10px; white-space:pre-wrap; }
.tc textarea { width:100%; border:0; border-top:1px solid var(--line); min-height:34px; }
.foot { display:flex; gap:10px; align-items:center; margin-top:6px; color:var(--dim); font-size:11px; flex-wrap:wrap; }
.foot button { background:none; border:0; color:var(--dim); cursor:pointer; padding:0; text-transform:lowercase; }
.foot button:hover { color:var(--acc); }
.degr { border:1px solid var(--warn); color:var(--warn); padding:2px 8px; display:inline-block; margin-bottom:6px; }
.err { color:var(--bad); }
.composer { border-top:1px solid var(--line); padding:10px 16px; }
.composer .wrapc { max-width:920px; margin:0 auto; display:grid; grid-template-columns:1fr auto; gap:8px; align-items:end; }
#cinput { width:100%; min-height:42px; max-height:40vh; resize:none; padding:10px 12px; line-height:1.5; }
.attach { display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
.attach span { position:relative; }
.attach img { height:48px; border:1px solid var(--line); display:block; }
.attach button { position:absolute; top:0; right:0; background:var(--bg); border:0; color:var(--bad); cursor:pointer; padding:0 4px; }
.side { width:280px; border-left:1px solid var(--line); overflow:auto; padding:12px; display:flex; flex-direction:column; gap:10px; flex-shrink:0; }
.side[hidden] { display:none; }
.side label { display:flex; flex-direction:column; gap:3px; }
.drop { outline:1px dashed var(--acc); outline-offset:-6px; }

/* traces */
.split { display:grid; grid-template-columns:minmax(300px,34%) 1fr; gap:12px; align-items:start; }
.tl { border:1px solid var(--line); max-height:calc(100vh - 140px); overflow:auto; }
.tl .it { display:grid; grid-template-columns:8px 1fr auto; gap:8px; padding:5px 8px; border-bottom:1px solid var(--line); cursor:pointer; }
.tl .it:hover,.tl .it[aria-current=true] { background:var(--bg2); }
.tl .it small { color:var(--dim); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dot { width:8px; height:8px; margin-top:4px; }
.wf { border:1px solid var(--line); }
.wf .r { display:grid; grid-template-columns:minmax(220px,38%) 1fr; border-bottom:1px solid var(--line); cursor:pointer; }
.wf .r:hover { background:var(--bg2); }
.wf .l { padding:3px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wf .l i { font-style:normal; color:var(--dim); }
.wf .tr { position:relative; border-left:1px solid var(--line); }
.wf .b { position:absolute; top:5px; height:10px; min-width:1px; }
.wf .ev { position:absolute; top:2px; width:1px; height:16px; background:var(--fg); }
.wf .ax { display:grid; grid-template-columns:minmax(220px,38%) 1fr; color:var(--dim); font-size:10px; border-bottom:1px solid var(--line); }
.wf .ax div:last-child { display:flex; justify-content:space-between; padding:2px 4px; border-left:1px solid var(--line); }

/* architect, plugins, media, harvester */
.agent { flex:1; display:flex; flex-direction:column; min-width:0; }
.alog { font-size:11px; display:grid; gap:2px; margin-bottom:6px; }
.alog .ok,.alog .no { font-weight:500; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; align-items:start; }
.card { border:1px solid var(--line); }
.card > .h { display:flex; gap:8px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line); }
.card > .h b { color:var(--acc); font-weight:500; text-transform:uppercase; letter-spacing:.06em; }
.card > .d { padding:6px 10px 0; color:var(--dim); }
.card > .pb { padding:10px; }
.badge { font-size:10px; border:1px solid var(--line2); color:var(--mid); padding:0 5px; text-transform:uppercase; }
.badge.adm { color:var(--vio); border-color:var(--vio); }
.gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
.gallery figure { margin:0; border:1px solid var(--line); }
.gallery img { width:100%; display:block; aspect-ratio:auto; background:var(--bg2); }
.gallery figcaption { padding:6px 8px; display:flex; gap:8px; color:var(--dim); font-size:11px; }
.gallery figcaption span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hv { border:1px solid var(--line); margin-bottom:8px; }
.hv .h { display:flex; gap:10px; padding:5px 10px; border-bottom:1px solid var(--line); }
.hv .st { display:grid; grid-template-columns:90px 70px 1fr; gap:8px; padding:2px 10px; font-size:11px; }
pre.src { counter-reset:l; padding:0; max-height:calc(100vh - 130px); }
pre.src span { display:block; padding:0 10px; }
pre.src span::before { counter-increment:l; content:counter(l); display:inline-block; width:6ch; margin-right:12px; color:var(--dim); text-align:right; }

/* overlays */
#pal { position:fixed; inset:0; background:#08090acc; display:flex; justify-content:center; align-items:flex-start; padding-top:14vh; z-index:20; }
#pal[hidden] { display:none; }
#pal .p { width:min(560px,92vw); border:1px solid var(--acc); background:var(--bg); }
#pal input { width:100%; border:0; border-bottom:1px solid var(--line); padding:10px 12px; background:var(--bg); }
#pal ul { list-style:none; margin:0; padding:0; max-height:50vh; overflow:auto; }
#pal li { padding:6px 12px; cursor:pointer; display:flex; justify-content:space-between; }
#pal li[aria-selected=true] { background:var(--acc2); color:var(--acc); }
#pal li small { color:var(--dim); }
dialog { background:var(--bg); color:var(--fg); border:1px solid var(--acc); padding:0; width:min(520px,92vw); }
dialog::backdrop { background:#08090acc; }
dialog form { display:grid; gap:10px; padding:14px; }
dialog label { display:grid; gap:3px; }
#toast { position:fixed; bottom:14px; right:14px; border:1px solid var(--acc); background:var(--bg); padding:8px 12px; z-index:30; max-width:60ch; transition:opacity .2s; }
#toast.no { border-color:var(--bad); color:var(--bad); }
#toast[hidden] { display:block; opacity:0; pointer-events:none; }
@media (max-width:900px) { .side { position:absolute; right:0; top:0; bottom:0; background:var(--bg); z-index:5; } .split,.plots { grid-template-columns:1fr; } .plots canvas + canvas { border-left:0; border-top:1px solid var(--line); } }
@media (prefers-reduced-motion:reduce) { .meta .live::after { animation:none; } }
</style>
</head>
<body>
<header>
  <nav role="tablist" aria-label="Views">
    <button role="tab" data-v="chat">Chat</button>
    <button role="tab" data-v="architect">Architect</button>
    <button role="tab" data-v="media">Media</button>
    <button role="tab" data-v="plugins">Plugins</button>
    <span class="sep"></span>
    <button role="tab" data-v="catalog">Catalog</button>
    <button role="tab" data-v="lanes">Lanes</button>
    <button role="tab" data-v="endpoints">Endpoints</button>
    <button role="tab" data-v="harvester">Harvester</button>
    <span class="sep"></span>
    <button role="tab" data-v="traces">Traces</button>
    <button role="tab" data-v="ops">Ops</button>
    <button role="tab" data-v="source">Source</button>
    <button role="tab" data-v="inspector">Inspector</button>
  </nav>
  <span class="grow"></span>
  <a href="/docs" target="_blank" rel="noopener" style="align-self:center;padding:0 12px">api</a>
  <button id="kbtn" title="Command palette (Ctrl+K)" aria-label="Command palette">⌘K</button>
  <button id="conn" title="Connection" aria-label="Connection settings"><i></i><span></span></button>
</header>

<main>
  <section class="view full" id="v-chat" hidden>
    <div class="chat">
      <div id="thread" aria-live="polite"></div>
      <div class="composer">
        <div class="wrapc">
          <div>
            <div class="attach" id="attach"></div>
            <textarea id="cinput" rows="1" aria-label="Message"></textarea>
          </div>
          <div class="row" style="flex-wrap:nowrap">
            <input type="file" id="cfile" accept="image/*" multiple hidden>
            <button class="btn q" id="cattach" title="Attach images" aria-label="Attach images">+img</button>
            <button class="btn q" id="cside" title="Parameters" aria-label="Toggle parameters">params</button>
            <button class="btn" id="csend">send</button>
            <button class="btn" id="cstop" hidden>stop</button>
          </div>
        </div>
      </div>
    </div>
    <aside class="side" id="side" aria-label="Chat parameters">
      <label><span class="lbl">model</span><input id="pmodel" list="modellist" value="free:auto"></label>
      <datalist id="modellist"><option value="free:auto"><option value="free:fast"><option value="free:smart"><option value="free:code"><option value="free:reasoning"></datalist>
      <div class="row">
        <label class="grow"><span class="lbl">temperature <b id="ptempv" class="acc">0.7</b></span><input id="ptemp" type="range" min="0" max="2" step="0.05" value="0.7"></label>
        <label style="width:96px"><span class="lbl">max tokens</span><input id="pmax" type="number" min="1" value="4096"></label>
      </div>
      <label><span class="lbl">reasoning effort</span>
        <select id="peffort"><option value="">default</option><option>low</option><option>medium</option><option>high</option></select></label>
      <label><span class="lbl">system</span><textarea id="psys" rows="3"></textarea></label>
      <div class="row"><label class="row" style="flex-direction:row"><input type="checkbox" id="pstream" checked> <span class="mid">stream</span></label>
        <label class="row" style="flex-direction:row"><input type="checkbox" id="pparallel" checked> <span class="mid">parallel tools</span></label></div>
      <label><span class="lbl">tools json</span><textarea id="ptools" rows="8" spellcheck="false"></textarea></label>
      <div class="row"><button class="btn q" id="ppreset">tools preset</button><button class="btn q" id="pclear">clear tools</button></div>
      <div class="row" style="margin-top:auto"><button class="btn q" id="cnew">new chat</button><button class="btn q" id="cexport">export</button></div>
    </aside>
  </section>

  <section class="view full" id="v-architect" hidden>
    <div class="agent">
      <div id="athread" style="flex:1;overflow:auto;padding:16px 0 24px" aria-live="polite"></div>
      <div class="composer"><div class="wrapc">
        <textarea id="ainput" rows="1" aria-label="Instruction for the Architect" style="width:100%;min-height:42px;resize:none;padding:10px 12px"></textarea>
        <div class="row" style="flex-wrap:nowrap"><span class="dim" id="aarm"></span><button class="btn q" id="areset">reset</button><button class="btn" id="asend">dispatch</button><button class="btn" id="astop" hidden>stop</button></div>
      </div></div>
    </div>
  </section>

  <section class="view" id="v-media" hidden>
    <div class="row" style="margin-bottom:12px;align-items:stretch">
      <textarea id="mprompt" class="grow" rows="2" aria-label="Image prompt"></textarea>
      <div style="display:grid;gap:6px">
        <div class="row"><select id="mmodel" aria-label="Image model"><option>nokey-image</option><option>nokey-image-flux</option><option>nokey-image-horde</option></select>
          <select id="msize" aria-label="Size"><option>1024x1024</option><option>1024x576</option><option>576x1024</option><option>1792x1024</option><option>1024x1792</option><option>512x512</option></select>
          <select id="mn" aria-label="Count"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
        <button class="btn" id="mgo">generate</button>
      </div>
    </div>
    <div class="gallery" id="mgal"></div>
  </section>

  <section class="view" id="v-plugins" hidden>
    <div class="row" style="margin-bottom:12px"><button class="btn" id="plnew">install</button><span class="grow"></span><span class="dim" id="plcount"></span></div>
    <div id="plinstall" hidden style="margin-bottom:12px">
      <textarea id="plcode" class="in" rows="12" spellcheck="false" aria-label="Plugin code"></textarea>
      <div class="row" style="margin-top:6px"><button class="btn" id="plgo">install &amp; mount</button><button class="btn q" id="plcancel">cancel</button></div>
    </div>
    <div class="cards" id="plgrid"></div>
  </section>

  <section class="view" id="v-catalog" hidden>
    <div class="row" style="margin-bottom:10px"><input id="cfilter" size="32" aria-label="Filter models"><button class="btn q" id="creload">reload</button><span class="grow"></span><span class="dim" id="ccount"></span></div>
    <table><thead><tr><th class="l" data-k="id">model</th><th class="l" data-k="owned_by">provider</th><th data-k="iq_effective">iq</th><th data-k="context_window">ctx</th><th class="l" data-k="caps">caps</th></tr></thead><tbody id="ctb"></tbody></table>
  </section>

  <section class="view" id="v-lanes" hidden>
    <div class="row" style="margin-bottom:10px"><select id="every" aria-label="Poll interval"><option value="5000">5s</option><option value="15000" selected>15s</option><option value="60000">60s</option><option value="0">off</option></select><span class="dim" id="lstat"></span></div>
    <div class="kpis" id="kpis"></div><div id="lanes"></div>
  </section>

  <section class="view" id="v-endpoints" hidden>
    <div class="row" style="margin-bottom:10px"><input id="efilter" size="32" aria-label="Filter endpoints"><button class="btn q" id="ereload">reload</button><span class="grow"></span><span class="dim" id="ecount"></span></div>
    <table><thead><tr><th class="l" data-k="name">endpoint</th><th class="l" data-k="id">id</th><th data-k="catalog_tuples">tuples</th><th data-k="models">hints</th><th class="l" data-k="url">url</th></tr></thead><tbody id="etb"></tbody></table>
  </section>

  <section class="view" id="v-harvester" hidden>
    <div class="row" style="margin-bottom:12px;align-items:stretch">
      <textarea id="hurls" class="grow" rows="4" spellcheck="false" aria-label="Endpoint URLs, one per line"></textarea>
      <div style="display:grid;gap:6px;align-content:start">
        <input id="hkey" type="password" autocomplete="off" aria-label="Bearer key for these endpoints">

<div id="toast" hidden role="status"></div>
<script type="module">
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const f = (n, d = 0) => Number.isFinite(n) ? n.toFixed(d) : "—";
const ms = (n) => !Number.isFinite(n) ? "—" : n >= 1000 ? (n / 1000).toFixed(2) + "s" : n.toFixed(0) + "ms";
const kfmt = (n) => n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
const store = {
  get(k, d = null) { try { const v = localStorage.getItem("nk." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("nk." + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem("nk." + k); } catch { /* storage unavailable */ } },
};

// ---------- credentials (one-time migration from the legacy base64+cookie scheme) ----------
(function migrate() {
  if (store.get("creds")) return;
  const old = (k) => { try { const v = localStorage.getItem("enc_" + k); return v ? decodeURIComponent(atob(v)) : ""; } catch { return ""; } };
  const c = { url: old("router_url"), key: old("router_apikey"), admin: old("admin_secret") };
  if (c.url || c.key || c.admin) store.set("creds", c);
  for (const k of ["router_url", "router_apikey", "admin_secret"]) {
    try { localStorage.removeItem("enc_" + k); } catch { /* storage unavailable */ }
    document.cookie = `enc_${k}=; path=/; max-age=0; SameSite=Strict`; // secrets must not ride on every request
  }
})();
const ORIGIN = /^https?:/.test(location.protocol) ? location.origin : "https://nokey-router.ziggyware.deno.net";
const creds = () => { const c = store.get("creds", {}); return { url: (c.url || ORIGIN).replace(/\/+$/, ""), key: c.key || "", admin: c.admin || "" }; };
function headers(admin = false, json = true) {
  const c = creds(), h = {};
  if (json) h["Content-Type"] = "application/json";
  if (c.key) h.Authorization = "Bearer " + c.key;
  if (admin && c.admin) h["x-admin-secret"] = c.admin;
  return h;
}

// ---------- toast ----------
let toastT = 0;
function toast(msg, bad = false) {
  const t = $("#toast");
  t.textContent = msg; t.className = bad ? "no" : ""; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, bad ? 6000 : 3000);
}

// ---------- instrumented requests (feed the Inspector) ----------
const ilog = [];
const IMAX = 300;
function irecord(e) {
  ilog.unshift(e);
  if (ilog.length > IMAX) ilog.pop();
  if (current === "inspector") renderInspector();
}
async function req(path, { method = "GET", admin = false, body, signal, raw = false } = {}) {
  const url = /^https?:/.test(path) ? path : creds().url + path;
  const e = { t: Date.now(), method, url, path: url.replace(creds().url, ""), status: 0, ms: 0, req: body, res: null, trace: "" };
  const t0 = performance.now();
  irecord(e);
  try {
    const res = await fetch(url, { method, headers: headers(admin), body: body === undefined ? undefined : JSON.stringify(body), signal });
    e.status = res.status;
    e.trace = (res.headers.get("traceparent") ?? "").split("-")[1] ?? "";
    if (raw) { e.ms = performance.now() - t0; e.res = "(stream)"; return res; }
    const text = await res.text();
    e.ms = performance.now() - t0;
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error(text.trimStart().startsWith("<") ? "Router URL returned HTML, not the API" : `Non-JSON response (HTTP ${res.status})`); }
    e.res = data;
    if (!res.ok) throw new Error(`${res.status} ${data?.error?.message ?? ""}`.trim());
    return data;
  } catch (err) {
    e.ms ||= performance.now() - t0;
    e.res ??= { error: String(err.message ?? err) };
    throw err;
  } finally {
    if (current === "inspector") renderInspector();
  }
}
// One SSE block = {data, comment}; works for chat streams and the live trace tail.
async function* sse(res, signal) {
  const rd = res.body.pipeThrough(new TextDecoderStream()).getReader();
  signal?.addEventListener("abort", () => rd.cancel().catch(() => {}), { once: true });
  let buf = "";
  for (;;) {
    const { value, done } = await rd.read();
    if (done) break;
    buf += value.replace(/\r\n/g, "\n");
    for (let i = buf.indexOf("\n\n"); i >= 0; i = buf.indexOf("\n\n")) {
      const block = buf.slice(0, i);
      buf = buf.slice(i + 2);
      const lines = block.split("\n");
      const data = lines.filter((l) => l.startsWith("data:")).map((l) => l.slice(5).replace(/^ /, "")).join("\n");
      const comment = lines.filter((l) => l.startsWith(":")).map((l) => l.slice(1).trim()).join(" ");
      yield { data, comment };
    }
  }
}

// ---------- markdown (sanitised; libraries load lazily, plain text until then) ----------
const mdlib = Promise.all([
  import("https://cdn.jsdelivr.net/npm/marked@18.1.3/lib/marked.esm.js"),
  import("https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.es.mjs"),
  import("https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/es/highlight.min.js"),
]).then(([m, p, h]) => ({ marked: m.marked, purify: p.default, hljs: h.default })).catch(() => null);
let MD = null;
mdlib.then((x) => { MD = x; $$(".md[data-src]").forEach((el) => renderMd(el, el.dataset.src)); });
function renderMd(el, text, final = true) {
  if (!MD) { el.textContent = text; if (final) el.dataset.src = text; return; }
  delete el.dataset.src;
  el.innerHTML = MD.purify.sanitize(MD.marked.parse(text, { gfm: true, breaks: false }), { ADD_ATTR: ["target"] });
  for (const a of $$("a", el)) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
  for (const pre of $$("pre", el)) {
    const code = $("code", pre);
    if (final && code && !code.dataset.hl) { try { MD.hljs.highlightElement(code); } catch { /* unknown language */ } code.dataset.hl = 1; }
    const b = document.createElement("button");
    b.className = "btn q cp"; b.textContent = "copy";
    b.onclick = () => navigator.clipboard.writeText((code ?? pre).innerText).then(() => toast("copied"));
    pre.append(b);
  }
}

// ---------- views / routing ----------
const VIEWS = $$("nav [data-v]").map((b) => b.dataset.v);
const enter = {}; // view -> hook run on activation
let current = "";
function go(v) {
  if (!VIEWS.includes(v)) v = "chat";
  current = v;
  for (const b of $$("nav [data-v]")) b.setAttribute("aria-selected", b.dataset.v === v);
  for (const s of $$("main > .view")) s.hidden = s.id !== "v-" + v;
  if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
  enter[v]?.();
}
$("nav").onclick = (e) => { const b = e.target.closest("[data-v]"); if (b) go(b.dataset.v); };
addEventListener("hashchange", () => go(location.hash.slice(1)));

// ---------- connection ----------
let health = null;
function connState(ok, text) {
  $("#conn i").className = ok === null ? "" : ok ? "ok" : "no";
  $("#conn span").textContent = text ?? new URL(creds().url).host;
}
async function ping() {
  try {
    health = await req("/health");
    connState(true, `${new URL(creds().url).host} · ${health.coverage?.configured_endpoints ?? "?"} endpoints`);
    return health;
  } catch (e) { connState(false); throw e; }
}
$("#conn").onclick = () => {
  const c = creds();
  $("#curl").value = c.url; $("#ckey").value = c.key; $("#cadm").value = c.admin; $("#cstat").textContent = "";
  $("#dconn").showModal();
};
$("#csave").onclick = async (e) => {
  e.preventDefault();
  store.set("creds", { url: $("#curl").value.trim(), key: $("#ckey").value.trim(), admin: $("#cadm").value.trim() });
  $("#cstat").textContent = "testing…"; $("#cstat").className = "dim grow";
  try {
    await ping();
    const checks = [];
    try { await req("/v1/models"); checks.push("key ✓"); } catch (err) { checks.push("key ✗ " + err.message); }
    if (creds().admin) { try { await req("/v1/traces?limit=1", { admin: true }); checks.push("admin ✓"); } catch (err) { checks.push("admin ✗ " + err.message); } }
    $("#cstat").textContent = checks.join(" · ");
    $("#cstat").className = checks.some((c) => c.includes("✗")) ? "no grow" : "ok grow";
    armArchitect();
  } catch (err) { $("#cstat").textContent = err.message; $("#cstat").className = "no grow"; }
};

// ---------- command palette ----------
const commands = [];
const cmd = (name, run, hint = "") => commands.push({ name, run, hint });
let palSel = 0, palItems = [];
function palRender() {
  const q = $("#palq").value.trim().toLowerCase();
  palItems = commands.filter((c) => q.split(/\s+/).every((w) => c.name.toLowerCase().includes(w)));
  palSel = Math.min(palSel, Math.max(0, palItems.length - 1));
  $("#pall").innerHTML = palItems.map((c, i) => `<li role="option" data-i="${i}" aria-selected="${i === palSel}">${esc(c.name)}<small>${esc(c.hint)}</small></li>`).join("");
  $("#pall [aria-selected=true]")?.scrollIntoView({ block: "nearest" });
}
function palOpen() { $("#pal").hidden = false; $("#palq").value = ""; palSel = 0; palRender(); $("#palq").focus(); }
function palClose() { $("#pal").hidden = true; }
function palRun(i) { const c = palItems[i]; palClose(); c?.run(); }
$("#kbtn").onclick = palOpen;
$("#palq").oninput = () => { palSel = 0; palRender(); };
$("#palq").onkeydown = (e) => {
  if (e.key === "ArrowDown") { palSel = Math.min(palSel + 1, palItems.length - 1); palRender(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { palSel = Math.max(palSel - 1, 0); palRender(); e.preventDefault(); }
  else if (e.key === "Enter") palRun(palSel);
  else if (e.key === "Escape") palClose();
};
$("#pall").onclick = (e) => { const li = e.target.closest("[data-i]"); if (li) palRun(Number(li.dataset.i)); };
$("#pal").onclick = (e) => { if (e.target.id === "pal") palClose(); };
addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#pal").hidden ? palOpen() : palClose(); }
});
for (const v of VIEWS) cmd("go " + v, () => go(v), "view");
cmd("connection settings", () => $("#conn").click());
cmd("open api reference", () => window.open("/docs", "_blank", "noopener"));

// ---------- inspector ----------
let iopen = null;
function renderInspector() {
  const q = $("#ifilter").value.trim().toLowerCase();
  const rows = ilog.filter((e) => !q || `${e.method} ${e.path} ${e.status} ${e.trace}`.toLowerCase().includes(q));
  $("#icount").textContent = `${rows.length}/${ilog.length}`;
  $("#itb").innerHTML = rows.map((e) => {
    const k = `${e.t}-${e.path}`;
    const head = `<tr class="click" data-k="${esc(k)}"><td class="l">${new Date(e.t).toLocaleTimeString()}</td><td class="l">${e.method}</td><td class="l t" title="${esc(e.url)}">${esc(e.path)}</td>
      <td class="${e.status >= 200 && e.status < 300 ? "ok" : e.status ? "no" : "dim"}">${e.status || "…"}</td><td>${ms(e.ms)}</td><td class="l">${e.trace ? `<a href="#" data-tr="${e.trace}">${e.trace.slice(0, 12)}</a>` : ""}</td></tr>`;
    return iopen === k ? head + `<tr class="x"><td colspan="6"><pre class="wrap">${esc(JSON.stringify({ request: e.req, response: e.res }, null, 2).slice(0, 20000))}</pre></td></tr>` : head;
  }).join("");
}
$("#ifilter").oninput = renderInspector;
$("#iclear").onclick = () => { ilog.length = 0; renderInspector(); };
$("#itb").onclick = (ev) => {
  const a = ev.target.closest("[data-tr]");
  if (a) { ev.preventDefault(); openTrace(a.dataset.tr); return; }
  const tr = ev.target.closest("tr[data-k]");
  if (tr) { iopen = iopen === tr.dataset.k ? null : tr.dataset.k; renderInspector(); }
};
enter.inspector = renderInspector;

// =====================================================================
// CHAT
// =====================================================================
const conv = store.get("chat", { messages: [] });
let attachments = [];
let chatCtl = null;
const PARAMS = ["pmodel", "ptemp", "pmax", "peffort", "psys", "pstream", "pparallel", "ptools"];
(function loadParams() {
  const p = store.get("params", {});
  for (const id of PARAMS) if (p[id] !== undefined) { const el = $("#" + id); el.type === "checkbox" ? el.checked = p[id] : el.value = p[id]; }
  $("#ptempv").textContent = $("#ptemp").value;
  if (store.get("side") === false || (store.get("side") === null && innerWidth < 900)) $("#side").hidden = true;
})();
function saveParams() {
  const p = {};
  for (const id of PARAMS) { const el = $("#" + id); p[id] = el.type === "checkbox" ? el.checked : el.value; }
  store.set("params", p);
}
for (const id of PARAMS) $("#" + id).addEventListener("input", saveParams);
$("#ptemp").addEventListener("input", () => $("#ptempv").textContent = $("#ptemp").value);
$("#cside").onclick = () => { $("#side").hidden = !$("#side").hidden; store.set("side", !$("#side").hidden); };
const TOOL_PRESET = [
  { type: "function", function: { name: "get_weather", description: "Current weather for a city", parameters: { type: "object", properties: { city: { type: "string" } }, required: ["city"] } } },
  { type: "function", function: { name: "get_time", description: "Current time in an IANA timezone", parameters: { type: "object", properties: { tz: { type: "string" } }, required: ["tz"] } } },
];
$("#ppreset").onclick = () => { $("#ptools").value = JSON.stringify(TOOL_PRESET, null, 2); $("#pparallel").checked = true; saveParams(); };
$("#pclear").onclick = () => { $("#ptools").value = ""; saveParams(); };

function saveConv() {
  if (store.set("chat", conv)) return;
  // Quota: keep text, drop inline images from the persisted copy.
  const lite = { messages: conv.messages.map((m) => Array.isArray(m.content) ? { ...m, content: m.content.filter((b) => b.type === "text") } : m) };
  store.set("chat", lite);
}
const wire = (m) => {
  const o = { role: m.role, content: m.content };
  if (m.tool_calls?.length) o.tool_calls = m.tool_calls;
  if (m.tool_call_id) o.tool_call_id = m.tool_call_id;
  if (m.name) o.name = m.name;
  return o;
};
const textOf = (c) => typeof c === "string" ? c : Array.isArray(c) ? c.filter((b) => b.type === "text").map((b) => b.text).join("\n") : "";

// ---- rendering ----
const thread = $("#thread");
const nearBottom = () => thread.scrollHeight - thread.scrollTop - thread.clientHeight < 120;
function answeredIds(i) {
  const s = new Set();
  for (let j = i + 1; j < conv.messages.length && conv.messages[j].role === "tool"; j++) s.add(conv.messages[j].tool_call_id);
  return s;
}
function msgEl(m, i) {
  const el = document.createElement("article");
  el.dataset.i = i;
  if (m.role === "user") {
    el.className = "msg u";
    const imgs = Array.isArray(m.content) ? m.content.filter((b) => b.type === "image_url").map((b) => `<img src="${esc(b.image_url.url)}" alt="attachment">`).join("") : "";
    el.innerHTML = `<div class="body">${imgs}${esc(textOf(m.content))}</div>`;
  } else if (m.role === "tool") {
    el.className = "msg t";
    el.innerHTML = `<div class="body"><span class="dim">${esc(m.name ?? "")} ${esc(m.tool_call_id)} →</span> ${esc(textOf(m.content))}</div>`;
  } else {
    el.className = "msg a";
    el.innerHTML = `<div class="meta"></div><details class="rs" hidden><summary></summary><div class="rb"></div></details><div class="md"></div><div class="tcalls"></div><div class="foot"></div>`;
    paint(el, m, i);
  }
  return el;
}
function paint(el, m, i) {
  const k = m._m ?? {};
  const live = Boolean(k.live);
  const meta = [];
  if (k.degraded) meta.push(`<span class="warn">degraded · every endpoint failed · no answer fabricated</span>`);
  else if (live && !k.ttft) meta.push(`<span class="live">${k.routing ? `routing · ${k.routing} attempts` : "routing"}</span>`);
  else if (live) meta.push(`<span class="live">streaming</span>`);
  if (k.tuple) meta.push(`<b title="${esc(k.provider ?? "")}">${esc(k.tuple)}</b>`);
  $(".meta", el).innerHTML = meta.join("");
  const rs = $("details.rs", el);
  if (m.reasoning_content) {
    rs.hidden = false;
    if (live && !m.content && !k.rsTouched) rs.open = true;
    $("summary", rs).textContent = `reasoning · ${kfmt(m.reasoning_content.length)} chars${k.rsMs ? ` · ${ms(k.rsMs)}` : ""}`;
    const rb = $(".rb", rs), stick = rb.scrollHeight - rb.scrollTop - rb.clientHeight < 40;
    rb.textContent = m.reasoning_content;
    if (stick) rb.scrollTop = rb.scrollHeight;
  }
  renderMd($(".md", el), m.content ?? "", !live);
  const tc = $(".tcalls", el);
  if (m.tool_calls?.length) {
    const done = answeredIds(i);
    const open = !live && i === conv.messages.length - 1 && m.tool_calls.some((t) => !done.has(t.id));
    tc.innerHTML = m.tool_calls.map((t) => {
      let args = t.function?.arguments ?? "";
      try { args = JSON.stringify(JSON.parse(args), null, 2); } catch { /* partial JSON while streaming */ }
      return `<div class="tc"><div class="h"><b>${esc(t.function?.name ?? "")}</b><span class="dim">${esc(t.id ?? "")}</span></div><pre>${esc(args)}</pre>${open ? `<textarea data-id="${esc(t.id)}" data-name="${esc(t.function?.name ?? "")}" aria-label="Result for ${esc(t.function?.name ?? "")}" placeholder="result"></textarea>` : ""}</div>`;
    }).join("") + (open ? `<div class="row"><button class="btn" data-act="results">send ${m.tool_calls.length} result${m.tool_calls.length > 1 ? "s" : ""}</button></div>` : "");
  } else tc.innerHTML = "";
  const foot = [];
  if (k.error) foot.push(`<span class="err">${esc(k.error)}</span>`);
  if (!live) {
    if (k.ttft) foot.push(`ttft ${ms(k.ttft)}`);
    if (k.total) foot.push(`total ${ms(k.total)}`);
    const gen = (k.total ?? 0) - (k.ttft ?? 0);
    if (k.chars && gen > 0) foot.push(`${f(k.chars / 4 / (gen / 1000), 0)} tok/s`);
    if (k.finish) foot.push(esc(k.finish));
    if (k.trace) foot.push(`<button data-act="trace" data-tr="${esc(k.trace)}">trace</button>`);
    if (m.content) foot.push(`<button data-act="copy">copy</button>`);
    if (i === conv.messages.length - 1) foot.push(`<button data-act="retry">retry</button>`);
  }
  $(".foot", el).innerHTML = foot.join(" · ");
}
function renderThread() {
  thread.replaceChildren(...conv.messages.map(msgEl));
  thread.scrollTop = thread.scrollHeight;
}
thread.addEventListener("toggle", (e) => {
  const el = e.target.closest?.("article"); if (!el || !e.target.matches("details.rs")) return;
  const m = conv.messages[el.dataset.i]; if (m?._m) m._m.rsTouched = true;
}, true);
thread.onclick = async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const el = b.closest("article"), i = Number(el.dataset.i), m = conv.messages[i];

// =====================================================================
// HARVESTER — browser-side verification → services.json registry entries
// =====================================================================
const CHALLENGE = { formula: "((17 * 23) + (19^2) - 48) / 2", expected: 352 };
let harvested = [];
function entropy(s) { const fr = new Map(); for (const c of s) fr.set(c, (fr.get(c) ?? 0) + 1); let h = 0; for (const n of fr.values()) { const p = n / s.length; h -= p * Math.log2(p); } return h; }
function shapes(input) {
  const u = input.trim().replace(/\/+$/, "");
  if (/\/chat\/completions$/.test(u)) { const base = u.replace(/\/chat\/completions$/, ""); return [{ base, url: u, models: base + "/models" }]; }
  return [{ base: u, url: u + "/chat/completions", models: u + "/models" }, ...(/\/v1$/.test(u) ? [] : [{ base: u + "/v1", url: u + "/v1/chat/completions", models: u + "/v1/models" }])];
}
async function harvestOne(input, key, el) {
  const stage = (name, ok, ms_, detail) => el.insertAdjacentHTML("beforeend", `<div class="st"><span class="mid">${name}</span><span class="${ok ? "ok" : "no"}">${ok ? "ok" : "fail"} ${ms_ ? ms(ms_) : ""}</span><span class="dim">${esc(detail)}</span></div>`);
  const auth = key ? { Authorization: "Bearer " + key } : {};
  const timed = async (fn) => { const t0 = performance.now(); try { return [await fn(), performance.now() - t0, null]; } catch (e) { return [null, performance.now() - t0, e]; } };
  const why = (e) => e?.name === "TypeError" ? "network or CORS blocked from the browser" : e?.name === "TimeoutError" ? "timeout" : e?.message ?? String(e);
  for (const s of shapes(input)) {
    const [list, mMs, mErr] = await timed(async () => {
      const r = await fetch(s.models, { headers: auth, signal: AbortSignal.timeout(8000) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json(); const arr = Array.isArray(j.data) ? j.data : Array.isArray(j) ? j : Array.isArray(j.models) ? j.models : [];
      return arr.map((m) => String(m.id ?? m.name ?? m)).filter(Boolean);
    });
    stage("models", Boolean(list?.length), mMs, list ? `${list.length} models · ${s.models}` : `${why(mErr)} · ${s.models}`);
    const model = list?.[0] ?? "gpt-4o-mini";
    const [reply, cMs, cErr] = await timed(async () => {
      const r = await fetch(s.url, { method: "POST", headers: { "Content-Type": "application/json", ...auth }, signal: AbortSignal.timeout(20000),
        body: JSON.stringify({ model, temperature: 0, max_tokens: 32, messages: [{ role: "user", content: `Compute ${CHALLENGE.formula}. Reply with only the integer.` }] }) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      return String(j.choices?.[0]?.message?.content ?? j.response ?? j.content ?? "");
    });
    if (reply === null) { stage("challenge", false, cMs, `${why(cErr)} · ${s.url}`); continue; }
    const got = Number((reply.match(/-?\d+(?:\.\d+)?/) ?? [])[0]);
    const degenerate = reply.length >= 32 && entropy(reply.slice(0, 128)) < 1.15;
    const pass = got === CHALLENGE.expected && !degenerate;
    stage("challenge", pass, cMs, degenerate ? "low-entropy collapse" : `${CHALLENGE.formula} = ${CHALLENGE.expected}; got "${reply.trim().slice(0, 60)}"`);
    if (!pass) continue;
    const host = new URL(s.url).host;
    return {
      name: `Harvested ${host}`, category: "Harvested", baseUrl: s.base, url: s.url, modelsUrl: list?.length ? s.models : null, defaultModel: model,
      authRequired: Boolean(key), authMode: key ? "Bearer" : "None (Omit Header)", authHeader: null,
      notes: `Browser-verified ${new Date().toISOString().slice(0, 10)}${key ? "; needs a bearer key configured server-side" : ""}.`,
      telemetry: { overallStatus: "math_verified", activeModel: model, rttMs: Math.round(cMs), discoveredModels: (list ?? []).slice(0, 50),
        stages: { math: { status: "ok", latencyMs: Math.round(cMs), formula: CHALLENGE.formula, expected: CHALLENGE.expected, actual: got, rawReply: reply.trim().slice(0, 200) } } },
    };
  }
  return null;
}

$("#hcopy").onclick = () => navigator.clipboard.writeText(JSON.stringify(harvested, null, 2)).then(() => toast(`${harvested.length} services.json entries copied`));

// =====================================================================
// LANES — kernel state; log-normal TTFT densities + EWMA history
// =====================================================================
const MODES = ["fast", "smart", "code", "reasoning"];
const PAL = ["#d4ff00", "#7cc4ff", "#ff8a5c", "#c79bff", "#5cffc0"];
const Z95 = 1.6448536269514722;
const hist = new Map(); // tupleId -> [{t, ttft}]
const kpiPrev = {};
let lanesTimer = 0;
const lnQ = (c, z) => Math.exp(c.logTtftMu + z * c.logTtftSigma);
function record(h) {
  const t = Date.now(), seen = new Set();
  for (const m of MODES) for (const c of h["current_best_" + m] ?? []) {
    if (seen.has(c.tupleId)) continue; seen.add(c.tupleId);
    const a = hist.get(c.tupleId) ?? []; a.push({ t, ttft: c.ewmaTtftMs }); if (a.length > 720) a.shift(); hist.set(c.tupleId, a);
  }
}
function kpis(h) {
  const cv = h.coverage ?? {}, sec = h.security ?? {};
  const items = [["endpoints", cv.configured_endpoints], ["registry", cv.registry_endpoints], ["tuples", cv.catalog_tuples], ["sweep", cv.sweep_candidates], ["l1 cache", sec.l1_cache_entries]];
  const flags = [["auth", sec.auth_enabled], ["admin guard", sec.admin_guard_enabled], ["openrouter", sec.openrouter_free_enabled], ["strict", h.control_kernel?.strict_errors]];
  $("#kpis").innerHTML = items.map(([k, v]) => {
    const d = Number.isFinite(kpiPrev[k]) && v !== kpiPrev[k] ? `<i>${v > kpiPrev[k] ? "+" : ""}${v - kpiPrev[k]}</i>` : "";
    kpiPrev[k] = v;
    return `<div class="kpi"><b>${esc(v ?? "—")}${d}</b><span>${k}</span></div>`;
  }).join("") + flags.map(([k, v]) => `<div class="kpi"><b class="${v ? "ok" : "no"}">${v ? "on" : "off"}</b><span>${k}</span></div>`).join("")
    + (sec.service_json_load_error ? `<div class="kpi"><b class="no">err</b><span>${esc(sec.service_json_load_error)}</span></div>` : "");
}
function lanes(h) {
  const root = $("#lanes");
  if (!root.children.length) root.innerHTML = MODES.map((m) => `<div class="lane" id="l-${m}"><h3>${m}</h3>
    <table><thead><tr><th>tuple</th><th>iq</th><th>rel θ</th><th>p50</th><th>p95</th><th>σ ln</th><th>ewma ttft</th><th>tps</th><th>E[fast]</th><th>score</th><th>ctx</th><th>caps</th></tr></thead><tbody></tbody></table>
    <div class="plots"><canvas class="pdf" aria-label="${m} TTFT log-normal densities"></canvas><canvas class="trk" aria-label="${m} EWMA TTFT history"></canvas></div></div>`).join("");
  for (const m of MODES) {
    const cs = h["current_best_" + m] ?? [], el = $("#l-" + m);
    $("tbody", el).innerHTML = cs.length ? cs.map((c, i) => `<tr>
      <td class="t" title="${esc(c.tupleId)}"><span class="sw" style="background:${PAL[i % PAL.length]}"></span>${esc(c.tupleId)}</td>
      <td>${f(c.iqEffective, 3)}</td><td>${f(c.reliabilityDraw, 3)}</td><td>${ms(lnQ(c, 0))}</td><td>${ms(lnQ(c, Z95))}</td><td>${f(c.logTtftSigma, 3)}</td>
      <td>${ms(c.ewmaTtftMs)}</td><td>${f(c.ewmaTps, 1)}</td><td>${ms(c.expectedFastMs)}</td><td>${f(c.smartScore, 3)}</td>
      <td>${c.contextWindow ? kfmt(c.contextWindow) : "—"}</td><td>${[c.supportsReasoning && "R", c.supportsVision && "V", c.isCodingSpecialist && "C"].filter(Boolean).join("")}</td></tr>`).join("")
      : `<tr><td colspan="12">—</td></tr>`;
    drawPdf($(".pdf", el), cs); drawTrack($(".trk", el), cs);
  }
}
function canvas2d(cv) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, r.width, r.height); g.font = '10px "IBM Plex Mono", monospace';
  return [g, r.width, r.height];
}
function logAxis(g, W, H, lo, hi, horizontal) {
  g.strokeStyle = "#1f2326"; g.fillStyle = "#6b6f63"; g.lineWidth = 1;
  for (let e = Math.ceil(Math.log10(lo)); e <= Math.floor(Math.log10(hi)); e++) {
    const v = 10 ** e, u = (Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo));
    g.beginPath();
    if (horizontal) { const x = 8 + u * (W - 16); g.moveTo(x, 4); g.lineTo(x, H - 14); g.stroke(); g.fillText(ms(v), Math.min(x + 2, W - g.measureText(ms(v)).width - 2), H - 3); }
    else { const y = H - 14 - u * (H - 22); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); g.fillText(ms(v), 4, y - 2); }
  }
}
// Density of ln T ~ N(mu, sigma²): exact per-unit-ln(t) density on a log-time axis.
function drawPdf(cv, cs) {
  const [g, W, H] = canvas2d(cv);
  if (!cs.length) return;
  let lo = Infinity, hi = 0;
  for (const c of cs) { lo = Math.min(lo, lnQ(c, -3)); hi = Math.max(hi, lnQ(c, 3)); }
  lo = Math.max(1, lo); hi = Math.max(hi, lo * 10);
  logAxis(g, W, H, lo, hi, true);
  const L0 = Math.log(lo), L1 = Math.log(hi), N = 240;
  const peak = Math.max(...cs.map((c) => 1 / (Math.max(c.logTtftSigma, 1e-3) * Math.sqrt(2 * Math.PI))));
  cs.forEach((c, i) => {
    const s = Math.max(c.logTtftSigma, 1e-3);
    g.strokeStyle = PAL[i % PAL.length]; g.lineWidth = i ? 1 : 1.5; g.beginPath();
    for (let k = 0; k <= N; k++) {
      const z = (L0 + (k / N) * (L1 - L0) - c.logTtftMu) / s, p = Math.exp(-0.5 * z * z) / (s * Math.sqrt(2 * Math.PI));
      const x = 8 + (k / N) * (W - 16), y = H - 14 - (p / peak) * (H - 22);
      k ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  });
}
function drawTrack(cv, cs) {
  const [g, W, H] = canvas2d(cv);
  const all = cs.flatMap((c) => hist.get(c.tupleId) ?? []);
  const vals = all.map((p) => p.ttft).filter((v) => v > 0);
  if (!vals.length) return;
  const t0 = Math.min(...all.map((p) => p.t)), t1 = Math.max(t0 + 1, ...all.map((p) => p.t));
  const lo = Math.max(1, Math.min(...vals) / 1.5), hi = Math.max(lo * 10, Math.max(...vals) * 1.5);
  logAxis(g, W, H, lo, hi, false);
  g.fillStyle = "#6b6f63"; g.fillText(`${Math.round((t1 - t0) / 60000)}m`, W - 30, H - 3);
  cs.forEach((c, i) => {
    const a = hist.get(c.tupleId) ?? []; if (!a.length) return;
    g.strokeStyle = g.fillStyle = PAL[i % PAL.length]; g.lineWidth = i ? 1 : 1.5; g.beginPath();
    a.forEach((p, k) => {
      const x = 40 + ((p.t - t0) / (t1 - t0)) * (W - 48), y = H - 14 - ((Math.log(Math.max(p.ttft, lo)) - Math.log(lo)) / (Math.log(hi) - Math.log(lo))) * (H - 22);
      k ? g.lineTo(x, y) : g.moveTo(x, y);
      if (a.length === 1) g.fillRect(x - 1.5, y - 1.5, 3, 3);
    });
    g.stroke();
  });
}
async function pollLanes() {
  try { const t = performance.now(); await ping(); record(health); kpis(health); lanes(health); $("#lstat").textContent = `${new Date().toLocaleTimeString()} · ${ms(performance.now() - t)}`; $("#lstat").className = "dim"; }
  catch (e) { $("#lstat").textContent = e.message; $("#lstat").className = "no"; }
}
function scheduleLanes() {
  clearInterval(lanesTimer);
  const every = Number($("#every").value);
  if (every) lanesTimer = setInterval(() => { if (current === "lanes" && !document.hidden) pollLanes(); }, every);
}
$("#every").onchange = scheduleLanes;
addEventListener("resize", () => { if (current === "lanes" && health) lanes(health); });
enter.lanes = () => { pollLanes(); scheduleLanes(); };

// =====================================================================
// ENDPOINTS
// =====================================================================
let endpoints = [], esort = { k: "catalog_tuples", d: -1 }, eopen = null;
async function loadEndpoints() { try { endpoints = (await req("/v1/endpoints")).data ?? []; renderEndpoints(); } catch (e) { toast("endpoints: " + e.message, true); } }
function renderEndpoints() {
  const q = $("#efilter").value.trim().toLowerCase();
  const rows = endpoints.filter((e) => !q || [e.id, e.name, e.url, ...(e.models ?? [])].join(" ").toLowerCase().includes(q));
  const key = (e) => esort.k === "models" ? (e.models ?? []).length : e[esort.k];
  rows.sort((a, b) => { const x = key(a), y = key(b); return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * esort.d; });
  $("#ecount").textContent = `${rows.length}/${endpoints.length} · ${rows.reduce((s, e) => s + (e.catalog_tuples || 0), 0)} tuples`;
  $("#etb").innerHTML = rows.map((e) => `<tr class="click" data-id="${esc(e.id)}"><td class="t">${esc(e.name)}</td><td class="l t">${esc(e.id)}</td><td class="${e.catalog_tuples ? "" : "no"}">${e.catalog_tuples}</td><td>${(e.models ?? []).length}</td><td class="l t" title="${esc(e.url)}">${esc(e.url)}</td></tr>`
    + (eopen === e.id ? `<tr class="x"><td colspan="5">${(e.models ?? []).map(esc).join(" · ")}</td></tr>` : "")).join("");
}
$("#efilter").oninput = renderEndpoints;
$("#ereload").onclick = loadEndpoints;
$$("#v-endpoints th[data-k]").forEach((th) => th.onclick = () => { esort = { k: th.dataset.k, d: esort.k === th.dataset.k ? -esort.d : (["catalog_tuples", "models"].includes(th.dataset.k) ? -1 : 1) }; renderEndpoints(); });
$("#etb").onclick = (ev) => { const tr = ev.target.closest("tr[data-id]"); if (tr) { eopen = eopen === tr.dataset.id ? null : tr.dataset.id; renderEndpoints(); } };
enter.endpoints = () => { if (!endpoints.length) loadEndpoints(); };

// =====================================================================
// TRACES — live tail + span waterfall
// =====================================================================
const traces = new Map(); // id -> Map(spanId -> span)
let tsel = null, tliveCtl = null, tdirty = false;
const OUT_COLOR = { won: "#d4ff00", failed: "#ff5c5c", timeout: "#ffb547", late: "#6b6f63", cancelled: "#3a3f43" };
const spanColor = (s) => OUT_COLOR[s.attrs.outcome] ?? (s.status === "error" ? "#ff5c5c" : s.end === null ? "#7cc4ff" : s.status === "ok" ? "#a3a79a" : "#6b6f63");
function upsert(id, span) {
  let t = traces.get(id);
  if (!t) { t = new Map(); traces.set(id, t); while (traces.size > 300) traces.delete(traces.keys().next().value); }
  t.set(span.id, span);
  if (!tdirty && current === "traces") { tdirty = true; requestAnimationFrame(renderTraces); }
}
function rootOf(t) { for (const s of t.values()) if (!t.has(s.parent)) return s; }
function renderTraces() {
  tdirty = false;
  const q = $("#tfilter").value.trim().toLowerCase(), errOnly = $("#terr").checked;
  const rows = [];
  for (const [id, t] of [...traces].reverse()) {
    const r = rootOf(t); if (!r) continue;
    if (errOnly && r.status !== "error") continue;
    const tuple = r.attrs.tuple ?? "";
    if (q && ![id, r.name, r.attrs["model.requested"], r.attrs.mode, tuple].join(" ").toLowerCase().includes(q)) continue;
    const failed = [...t.values()].filter((s) => s.status === "error" && s.name === "attempt").length;
    rows.push(`<div class="it" role="option" data-id="${id}" aria-current="${id === tsel}"><span class="dot" style="background:${spanColor(r)}"></span>
      <div>${esc(r.name)} <span class="mid">${esc(r.attrs["model.requested"] ?? "")}</span> ${esc(r.attrs.mode ?? "")}<small>${esc(tuple || r.attrs.error || id)}</small></div>
      <div style="text-align:right">${ms((r.end ?? Date.now()) - r.start)}<small>${t.size} spans ${failed ? `<span class="no">${failed}✗</span>` : ""}</small></div></div>`);
  }
  $("#tlist").innerHTML = rows.join("");
  $("#tcount").textContent = `${rows.length}/${traces.size}`;
  if (tsel) renderWaterfall(tsel);
}
function renderWaterfall(id) {
  const t = traces.get(id); if (!t) return;
  const spans = [...t.values()], root = rootOf(t);
  const t0 = Math.min(...spans.map((s) => s.start));
  const t1 = Math.max(t0 + 1, ...spans.map((s) => s.end ?? Date.now()), ...spans.flatMap((s) => s.events.map((e) => e.t)));
  const W = t1 - t0, kids = new Map();
  for (const s of spans) { const p = s === root ? null : s.parent; kids.set(p, [...(kids.get(p) ?? []), s]); }
  const order = [];
  const walk = (p, d) => { for (const s of (kids.get(p) ?? []).sort((a, b) => a.start - b.start)) { order.push([s, d]); walk(s.id, d + 1); } };
  walk(null, 0);
  const pct = (x) => ((x - t0) / W * 100).toFixed(3) + "%";
  $("#wf").innerHTML = `<div class="ax"><div class="l">${esc(id)}</div><div><span>0</span><span>${ms(W / 2)}</span><span>${ms(W)}</span></div></div>` +
    order.map(([s, d]) => {
      const label = s.name === "attempt" ? (s.attrs.tuple ?? s.attrs.backend ?? "") : s.name === "tier" ? `${s.attrs.tier} ${s.attrs.label}` : s.name;
      const tip = Object.entries(s.attrs).map(([k, v]) => `${k}=${v}`).join("\n");
      const dur = (s.end ?? Date.now()) - s.start;
      return `<div class="r" data-sid="${s.id}" title="${esc(tip)}"><div class="l" style="padding-left:${8 + d * 12}px"><i>${esc(s.attrs.outcome ?? (s.end === null ? "…" : ""))} ${ms(dur)}</i> ${esc(label)}</div>
        <div class="tr"><span class="b" style="left:${pct(s.start)};width:${(dur / W * 100).toFixed(3)}%;background:${spanColor(s)}"></span>${s.events.map((e) => `<span class="ev" style="left:${pct(e.t)}" title="${esc(e.name + " " + JSON.stringify(e.attrs ?? {}))}"></span>`).join("")}</div></div>`;
    }).join("");
}
async function loadTraces() {
  try {
    const j = await req("/v1/traces?limit=60", { admin: true });
    await Promise.all(j.data.reverse().map(async (s) => {
      const full = await req("/v1/traces/" + s.id, { admin: true }).catch(() => null);
      for (const sp of full?.spans ?? [s.root]) upsert(s.id, sp);
    }));
    renderTraces();
  } catch (e) { toast("traces: " + e.message, true); }
}
async function toggleLive() {
  const btn = $("#tlive");
  if (tliveCtl) { tliveCtl.abort(); tliveCtl = null; btn.classList.remove("on"); btn.setAttribute("aria-pressed", "false"); return; }
  tliveCtl = new AbortController(); btn.classList.add("on"); btn.setAttribute("aria-pressed", "true");
  try {
    const res = await fetch(creds().url + "/v1/traces/live", { headers: headers(true, false), signal: tliveCtl.signal });
    if (!res.ok) throw new Error(`${res.status} ${(await res.json().catch(() => ({})))?.error?.message ?? ""}`);
    for await (const { data } of sse(res, tliveCtl.signal)) { if (data) { const e = JSON.parse(data); upsert(e.trace, e.span); } }
  } catch (e) { if (e.name !== "AbortError") toast("live: " + e.message, true); }
  if (tliveCtl) toggleLive();
}
function openTrace(id) {
  if (!id) return;
  tsel = id; go("traces");
  req("/v1/traces/" + id, { admin: true }).then((t) => { for (const s of t.spans) upsert(id, s); renderTraces(); })
    .catch((e) => toast(creds().admin ? e.message : "traces need the admin secret (connection settings)", true));
}
$("#tlive").onclick = toggleLive;
$("#tload").onclick = loadTraces;
$("#tfilter").oninput = renderTraces;
$("#terr").onchange = renderTraces;
$("#tlist").onclick = (ev) => { const it = ev.target.closest("[data-id]"); if (it) { tsel = it.dataset.id; $("#tattrs").hidden = true; renderTraces(); } };
$("#wf").onclick = (ev) => { const r = ev.target.closest("[data-sid]"); if (!r) return; const pre = $("#tattrs"); pre.hidden = false; pre.textContent = JSON.stringify(traces.get(tsel)?.get(r.dataset.sid), null, 2); };
enter.traces = () => { renderTraces(); if (!traces.size && creds().admin) loadTraces(); };
cmd("toggle live traces", () => { go("traces"); toggleLive(); });

async function op(name) {
  const all = $$("[data-op]"); all.forEach((b) => b.disabled = true);
  $("#ostat").textContent = name + " …"; $("#ostat").className = "dim";
  const t0 = performance.now();
  try {
    const body = name === "probe" ? { mode: $("#omode").value } : name === "resurrect" ? { limit: Math.max(1, Number($("#olimit").value) || 6) } : {};
    const j = await req("/v1/" + name, { method: "POST", admin: true, body });
    const rs = j.results ?? [];
    $("#otab").innerHTML = rs.length ? `<thead><tr><th>tuple</th><th>ok</th><th>canary</th><th>ttft</th><th class="l">error</th></tr></thead><tbody>` +
      rs.map((r) => `<tr><td class="t">${esc(r.tupleId)}</td><td class="${r.ok ? "ok" : "no"}">${r.ok ? "✓" : "✗"}</td><td>${r.passed === undefined ? "—" : r.passed ? "✓" : "✗"}</td><td>${ms(r.ms)}</td><td class="l t" title="${esc(r.error)}">${esc(r.error ?? "")}</td></tr>`).join("") + "</tbody>" : "";
    $("#oraw").hidden = false; $("#oraw").textContent = JSON.stringify(j, null, 2);
    $("#ostat").textContent = `${name} · ${ms(performance.now() - t0)}`; $("#ostat").className = "ok";
  } catch (e) { $("#ostat").textContent = `${name}: ${e.message}`; $("#ostat").className = "no"; }
  all.forEach((b) => b.disabled = false);
}
$$("[data-op]").forEach((b) => b.onclick = () => op(b.dataset.op));
for (const n of ["probe", "sync", "resurrect"]) cmd(n, () => { go("ops"); op(n); }, "admin");
let srcLines = [];
async function loadSource() {

    const j = await req("/v1/source?file=" + encodeURIComponent(file), { admin: true });
    srcLines = j.content.split("\n");
    $("#smeta").textContent = `${j.lines} lines · ${(j.bytes / 1024).toFixed(1)} KiB`;
    renderSource();
  } catch (e) { toast(e.message, true); }
}
function renderSource() {
  const q = $("#sgrep").value;
  $("#sout").innerHTML = srcLines.map((l, i) => (!q || l.includes(q)) ? `<span style="counter-set:l ${i}">${esc(l) || " "}</span>` : "").join("");
}
$("#sload").onclick = loadSource;
$("#sfile").onchange = loadSource;
$("#sgrep").oninput = renderSource;
