<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nokey-router · admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#08090a; --bg2:#0e1011; --line:#1f2326; --fg:#e8eadf; --dim:#6b6f63; --mid:#a3a79a; --acc:#d4ff00; --bad:#ff5c5c; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--fg); font:12px/1.45 "IBM Plex Mono",ui-monospace,monospace; }
header { display:flex; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:2; }
nav { display:flex; }
nav button { border:0; border-bottom:1px solid transparent; background:none; color:var(--dim); padding:4px 10px; font:inherit; cursor:pointer; text-transform:uppercase; letter-spacing:.08em; }
nav button[aria-selected=true] { color:var(--acc); border-color:var(--acc); }
input,select,button.act { background:var(--bg2); color:var(--fg); border:1px solid var(--line); font:inherit; padding:4px 8px; }
input:focus,select:focus,button:focus-visible { outline:1px solid var(--acc); outline-offset:-1px; }
button.act { cursor:pointer; color:var(--acc); text-transform:uppercase; letter-spacing:.06em; }
button.act:disabled { color:var(--dim); cursor:wait; }
a { color:var(--mid); }
.grow { flex:1; }
#status { color:var(--dim); min-width:16ch; text-align:right; }
#status.bad { color:var(--bad); }
main { padding:12px; }
.view[hidden] { display:none; }
.kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); border:1px solid var(--line); margin-bottom:12px; }
.kpi { padding:8px 10px; border-right:1px solid var(--line); }
.kpi b { display:block; font-size:18px; font-weight:500; color:var(--acc); font-variant-numeric:tabular-nums; }
.kpi span { color:var(--dim); text-transform:uppercase; font-size:10px; letter-spacing:.08em; }
.kpi i { font-style:normal; color:var(--mid); font-size:10px; margin-left:4px; }
.lane { border:1px solid var(--line); margin-bottom:12px; }
.lane h3 { margin:0; padding:6px 10px; border-bottom:1px solid var(--line); font-size:11px; font-weight:500; color:var(--acc); text-transform:uppercase; letter-spacing:.1em; }
.lane .plots { display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line); }
.lane canvas { width:100%; height:140px; display:block; }
.lane canvas + canvas { border-left:1px solid var(--line); }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th,td { padding:3px 8px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line); }
th { color:var(--dim); font-weight:400; text-transform:uppercase; font-size:10px; letter-spacing:.06em; cursor:default; }
th[data-k] { cursor:pointer; }
td:first-child,th:first-child { text-align:left; }
td.t { max-width:42ch; overflow:hidden; text-overflow:ellipsis; }
tr.x td { white-space:normal; color:var(--mid); text-align:left; }
tbody tr:hover td { background:var(--bg2); }
.sw { display:inline-block; width:8px; height:8px; margin-right:6px; }
.row { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
pre { margin:0; padding:10px; border:1px solid var(--line); background:var(--bg2); overflow:auto; max-height:70vh; white-space:pre; tab-size:2; }
pre.src { counter-reset:l; padding:0; }
pre.src span { display:block; padding:0 10px; }
pre.src span::before { counter-increment:l; content:counter(l); display:inline-block; width:6ch; margin-right:12px; color:var(--dim); text-align:right; }
.ok { color:var(--acc); } .no { color:var(--bad); }
.split { display:grid; grid-template-columns:minmax(300px,34%) 1fr; gap:12px; align-items:start; }
.tl { border:1px solid var(--line); max-height:78vh; overflow:auto; }
.tl .it { display:grid; grid-template-columns:8px 1fr auto; gap:8px; padding:5px 8px; border-bottom:1px solid var(--line); cursor:pointer; }
.tl .it:hover, .tl .it[aria-current=true] { background:var(--bg2); }
.tl .it small { color:var(--dim); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dot { width:8px; height:8px; margin-top:4px; }
.wf { border:1px solid var(--line); }
.wf .r { display:grid; grid-template-columns:minmax(220px,38%) 1fr; border-bottom:1px solid var(--line); cursor:pointer; }
.wf .r:hover { background:var(--bg2); }
.wf .l { padding:3px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wf .l i { font-style:normal; color:var(--dim); }
.wf .tr { position:relative; border-left:1px solid var(--line); }
.wf .b { position:absolute; top:5px; height:10px; min-width:1px; }
.wf .ev { position:absolute; top:2px; width:1px; height:16px; background:var(--fg); }
.wf .ax { display:grid; grid-template-columns:minmax(220px,38%) 1fr; color:var(--dim); font-size:10px; border-bottom:1px solid var(--line); }
.wf .ax div:last-child { display:flex; justify-content:space-between; padding:2px 4px; border-left:1px solid var(--line); }
.pg { display:grid; grid-template-columns:minmax(300px,40%) 1fr; gap:12px; align-items:start; }
.pg textarea { width:100%; background:var(--bg2); color:var(--fg); border:1px solid var(--line); font:inherit; padding:6px 8px; resize:vertical; }
.pg .col { display:flex; flex-direction:column; gap:8px; }
.out { border:1px solid var(--line); min-height:60px; max-height:40vh; overflow:auto; padding:8px 10px; white-space:pre-wrap; word-break:break-word; }
.out.rs { color:var(--mid); }
.out:empty { display:none; }
.metrics { display:flex; gap:16px; flex-wrap:wrap; color:var(--dim); font-variant-numeric:tabular-nums; }
.metrics b { color:var(--acc); font-weight:500; }
label.ck { display:flex; gap:6px; align-items:center; color:var(--mid); }
@media (max-width:760px) { .split,.pg { grid-template-columns:1fr; } }
@media (max-width:760px) { .lane .plots { grid-template-columns:1fr; } .lane canvas + canvas { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <nav role="tablist">
    <button role="tab" data-v="lanes" aria-selected="true">Lanes</button>
    <button role="tab" data-v="endpoints">Endpoints</button>
    <button role="tab" data-v="traces">Traces</button>
    <button role="tab" data-v="play">Playground</button>
    <button role="tab" data-v="ops">Ops</button>
    <button role="tab" data-v="source">Source</button>
  </nav>
  <span class="grow"></span>
  <input id="key" type="password" autocomplete="off" aria-label="ROUTER_API_KEY" placeholder="ROUTER_API_KEY" size="18">
  <input id="adm" type="password" autocomplete="off" aria-label="ADMIN_SECRET" placeholder="ADMIN_SECRET" size="18">
  <select id="every" aria-label="Poll interval">
    <option value="5000">5s</option><option value="15000" selected>15s</option><option value="60000">60s</option><option value="0">off</option>
  </select>
  <a href="/docs">api</a>
  <span id="status" role="status"></span>
</header>
<main>
  <section class="view" id="v-lanes"><div class="kpis" id="kpis"></div><div id="lanes"></div></section>
  <section class="view" id="v-endpoints" hidden>
    <div class="row"><input id="efilter" aria-label="Filter endpoints" size="32"><span id="ecount" class="grow"></span></div>
    <table><thead><tr><th data-k="name">endpoint</th><th data-k="id">id</th><th data-k="catalog_tuples">tuples</th><th data-k="models">hints</th><th data-k="url">url</th></tr></thead><tbody id="etb"></tbody></table>
  </section>
  <section class="view" id="v-traces" hidden>
    <div class="row">
      <button class="act" id="tlive" aria-pressed="false">live</button>
      <button class="act" id="tload">load</button>
      <input id="tfilter" aria-label="Filter traces" size="28">
      <label class="ck"><input type="checkbox" id="terr">errors</label>
      <span id="tcount" class="grow" style="text-align:right;color:var(--dim)"></span>
    </div>
    <div class="split"><div class="tl" id="tlist" role="listbox" aria-label="Traces"></div><div><div class="wf" id="wf"></div><pre id="tattrs" hidden></pre></div></div>
  </section>
  <section class="view" id="v-play" hidden>
    <div class="pg">
      <div class="col">
        <div class="row" style="margin:0">
          <input id="pmodel" value="free:auto" aria-label="Model" size="18">
          <select id="peffort" aria-label="Reasoning effort"><option value="">effort</option><option>low</option><option>medium</option><option>high</option></select>
          <label class="ck"><input type="checkbox" id="pstream" checked>stream</label>
          <label class="ck"><input type="checkbox" id="pparallel">parallel</label>
        </div>
        <textarea id="psys" rows="2" aria-label="System message"></textarea>
        <textarea id="pmsg" rows="6" aria-label="User message"></textarea>
        <textarea id="ptools" rows="8" aria-label="Tools JSON" spellcheck="false"></textarea>
        <div class="row" style="margin:0"><button class="act" id="pgo">send</button><button class="act" id="pstop" disabled>stop</button><button class="act" id="ppreset">tools preset</button></div>
      </div>
      <div class="col">
        <div class="metrics" id="pmet"></div>
        <div class="out rs" id="preason" aria-label="Reasoning" aria-live="polite"></div>
        <div class="out" id="pcontent" aria-label="Content" aria-live="polite"></div>
        <pre id="ptcalls" hidden></pre>
      </div>
    </div>
  </section>
  <section class="view" id="v-ops" hidden>
    <div class="row">
      <button class="act" data-op="probe">probe</button>
      <button class="act" data-op="sync">sync</button>
      <button class="act" data-op="resurrect">resurrect</button>
      <input id="rlimit" type="number" min="1" max="200" value="6" aria-label="Resurrect limit" style="width:7ch">
    </div>
    <table id="otab"></table>
    <pre id="oraw" hidden></pre>
  </section>
  <section class="view" id="v-source" hidden>
    <div class="row">
      <select id="sfile" aria-label="File"><option>main.ts</option><option>math.ts</option><option>index.html</option><option>CHANGES.md</option><option>services.json</option><option>deno.json</option></select>
      <button class="act" id="sload">read</button><input id="sgrep" aria-label="Filter lines" size="28"><span id="smeta"></span>
    </div>
    <pre class="src" id="sout"></pre>
  </section>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const store = { get(k) { try { return sessionStorage.getItem(k) || ""; } catch { return ""; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch {} } };
const MODES = ["fast", "smart", "code", "reasoning"];
const PAL = ["#d4ff00", "#7cc4ff", "#ff8a5c", "#c79bff", "#5cffc0"];
const Z95 = 1.6448536269514722;
const HMAX = 720;
const hist = new Map(); // tupleId -> [{t, ttft, rel}]
const kpiPrev = {};
let health = null, endpoints = [], esort = { k: "catalog_tuples", d: -1 }, timer = 0, srcLines = [];

for (const id of ["key", "adm"]) { const el = $("#" + id); el.value = store.get(id); el.oninput = () => store.set(id, el.value.trim()); }

function headers(admin) {
  const h = { "Content-Type": "application/json" };
  const k = $("#key").value.trim(), a = $("#adm").value.trim();
  if (k) h.Authorization = "Bearer " + k;
  if (admin && a) h["x-admin-secret"] = a;
  return h;
}
function status(msg, bad) { const s = $("#status"); s.textContent = msg; s.className = bad ? "bad" : ""; }
async function call(path, { method = "GET", admin = false, body } = {}) {
  const r = await fetch(path, { method, headers: headers(admin), body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: { message: `HTTP ${r.status}` } }));
  if (!r.ok) throw new Error(`${r.status} ${j?.error?.message ?? ""}`.trim());
  return j;
}

const f = (n, d = 0) => Number.isFinite(n) ? n.toFixed(d) : "—";
const ms = (n) => !Number.isFinite(n) ? "—" : n >= 1000 ? (n / 1000).toFixed(2) + "s" : n.toFixed(0) + "ms";
const lnQ = (c, z) => Math.exp(c.logTtftMu + z * c.logTtftSigma);

function record(h) {
  const t = Date.now(), seen = new Set();
  for (const m of MODES) for (const c of h["current_best_" + m] ?? []) {
    if (seen.has(c.tupleId)) continue;
    seen.add(c.tupleId);
    const a = hist.get(c.tupleId) ?? [];
    a.push({ t, ttft: c.ewmaTtftMs, rel: c.reliabilityDraw });
    if (a.length > HMAX) a.shift();
    hist.set(c.tupleId, a);
  }
}

function kpis(h) {
  const cv = h.coverage ?? {}, sec = h.security ?? {};
  const items = [
    ["endpoints", cv.configured_endpoints], ["registry", cv.registry_endpoints], ["tuples", cv.catalog_tuples],
    ["sweep", cv.sweep_candidates], ["l1 cache", sec.l1_cache_entries],
  ];
  const flags = [["auth", sec.auth_enabled], ["admin guard", sec.admin_guard_enabled], ["openrouter", sec.openrouter_free_enabled], ["strict", h.control_kernel?.strict_errors]];
  $("#kpis").innerHTML = items.map(([k, v]) => {
    const d = Number.isFinite(kpiPrev[k]) && v !== kpiPrev[k] ? `<i>${v > kpiPrev[k] ? "+" : ""}${v - kpiPrev[k]}</i>` : "";
    kpiPrev[k] = v;
    return `<div class="kpi"><b>${esc(v ?? "—")}${d}</b><span>${k}</span></div>`;
  }).join("") + flags.map(([k, v]) => `<div class="kpi"><b class="${v ? "ok" : "no"}">${v ? "on" : "off"}</b><span>${k}</span></div>`).join("")
    + (sec.service_json_load_error ? `<div class="kpi"><b class="no">err</b><span>${esc(sec.service_json_load_error)}</span></div>` : "");
}

function lanes(h) {
  const root = $("#lanes");
  if (!root.children.length) root.innerHTML = MODES.map((m) => `<div class="lane" id="l-${m}"><h3>${m}</h3>
    <table><thead><tr><th>tuple</th><th>iq</th><th>rel θ</th><th>p50</th><th>p95</th><th>σ ln</th><th>ewma ttft</th><th>tps</th><th>E[fast]</th><th>score</th><th>ctx</th><th>caps</th></tr></thead><tbody></tbody></table>
    <div class="plots"><canvas class="pdf" aria-label="${m} TTFT log-normal densities"></canvas><canvas class="trk" aria-label="${m} EWMA TTFT history"></canvas></div></div>`).join("");
  for (const m of MODES) {
    const cs = h["current_best_" + m] ?? [], el = $("#l-" + m);
    el.querySelector("tbody").innerHTML = cs.length ? cs.map((c, i) => `<tr>
      <td class="t" title="${esc(c.tupleId)}"><span class="sw" style="background:${PAL[i % PAL.length]}"></span>${esc(c.tupleId)}</td>
      <td>${f(c.iqEffective, 3)}</td><td>${f(c.reliabilityDraw, 3)}</td><td>${ms(lnQ(c, 0))}</td><td>${ms(lnQ(c, Z95))}</td><td>${f(c.logTtftSigma, 3)}</td>
      <td>${ms(c.ewmaTtftMs)}</td><td>${f(c.ewmaTps, 1)}</td><td>${ms(c.expectedFastMs)}</td><td>${f(c.smartScore, 3)}</td>
      <td>${c.contextWindow ? (c.contextWindow / 1000).toFixed(0) + "k" : "—"}</td>
      <td>${[c.supportsReasoning && "R", c.supportsVision && "V", c.isCodingSpecialist && "C"].filter(Boolean).join("")}</td></tr>`).join("")
      : `<tr><td colspan="12">—</td></tr>`;
    drawPdf(el.querySelector(".pdf"), cs);
    drawTrack(el.querySelector(".trk"), cs);
  }
}

function canvas2d(cv) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, r.width, r.height); g.font = '10px "IBM Plex Mono", monospace';
  return [g, r.width, r.height];
}
// Shared log-time x/y axis: ticks at decades, hairline grid.
function logAxis(g, W, H, lo, hi, horizontal) {
  g.strokeStyle = "#1f2326"; g.fillStyle = "#6b6f63"; g.lineWidth = 1;
  for (let e = Math.ceil(Math.log10(lo)); e <= Math.floor(Math.log10(hi)); e++) {
    const v = 10 ** e, u = (Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo));
    g.beginPath();
    if (horizontal) { const x = 8 + u * (W - 16); g.moveTo(x, 4); g.lineTo(x, H - 14); g.stroke(); g.fillText(ms(v), Math.min(x + 2, W - g.measureText(ms(v)).width - 2), H - 3); }
    else { const y = H - 14 - u * (H - 22); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); g.fillText(ms(v), 4, y - 2); }
  }
}
// Density of ln T ~ N(mu, sigma²); on a log-time axis this is the exact per-unit-ln(t) density.
function drawPdf(cv, cs) {
  const [g, W, H] = canvas2d(cv);
  if (!cs.length) return;
  let lo = Infinity, hi = 0;
  for (const c of cs) { lo = Math.min(lo, lnQ(c, -3)); hi = Math.max(hi, lnQ(c, 3)); }
  lo = Math.max(1, lo); hi = Math.max(hi, lo * 10);
  logAxis(g, W, H, lo, hi, true);
  const L0 = Math.log(lo), L1 = Math.log(hi), N = 240;
  const peak = Math.max(...cs.map((c) => 1 / (Math.max(c.logTtftSigma, 1e-3) * Math.sqrt(2 * Math.PI))));
  cs.forEach((c, i) => {
    const s = Math.max(c.logTtftSigma, 1e-3);
    g.strokeStyle = PAL[i % PAL.length]; g.lineWidth = i ? 1 : 1.5; g.beginPath();
    for (let k = 0; k <= N; k++) {
      const L = L0 + (k / N) * (L1 - L0), z = (L - c.logTtftMu) / s;
      const p = Math.exp(-0.5 * z * z) / (s * Math.sqrt(2 * Math.PI));
      const x = 8 + (k / N) * (W - 16), y = H - 14 - (p / peak) * (H - 22);
      k ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  });
}
function drawTrack(cv, cs) {
  const [g, W, H] = canvas2d(cv);
  const series = cs.map((c) => hist.get(c.tupleId) ?? []).filter((a) => a.length);
  if (!series.length) return;
  const all = series.flat(), t0 = Math.min(...all.map((p) => p.t)), t1 = Math.max(t0 + 1, ...all.map((p) => p.t));
  const vals = all.map((p) => p.ttft).filter((v) => v > 0);
  if (!vals.length) return;
  const lo = Math.max(1, Math.min(...vals) / 1.5), hi = Math.max(lo * 10, Math.max(...vals) * 1.5);
  logAxis(g, W, H, lo, hi, false);
  g.fillStyle = "#6b6f63"; g.fillText(`${Math.round((t1 - t0) / 60000)}m · ${all.length / series.length | 0}n`, W - 70, H - 3);
  cs.forEach((c, i) => {
    const a = hist.get(c.tupleId) ?? [];
    if (!a.length) return;
    g.strokeStyle = PAL[i % PAL.length]; g.fillStyle = g.strokeStyle; g.lineWidth = i ? 1 : 1.5; g.beginPath();
    a.forEach((p, k) => {
      const x = 40 + ((p.t - t0) / (t1 - t0)) * (W - 48);
      const y = H - 14 - ((Math.log(Math.max(p.ttft, lo)) - Math.log(lo)) / (Math.log(hi) - Math.log(lo))) * (H - 22);
      k ? g.lineTo(x, y) : g.moveTo(x, y);
      if (a.length === 1) g.fillRect(x - 1.5, y - 1.5, 3, 3);
    });
    g.stroke();
  });
}

async function pollHealth() {
  try {
    const t = performance.now();
    health = await call("/health");
    record(health); kpis(health); lanes(health);
    status(`${new Date().toLocaleTimeString()} · ${Math.round(performance.now() - t)}ms`);
  } catch (e) { status(e.message, true); }
}
function schedule() {
  clearInterval(timer);
  const ms = Number($("#every").value);
  if (ms) timer = setInterval(() => { if (!document.hidden) pollHealth(); }, ms);
}
$("#every").onchange = schedule;

async function loadEndpoints() {
  try { const j = await call("/v1/endpoints"); endpoints = j.data ?? []; renderEndpoints(); if (j.error) status(j.error, true); }
  catch (e) { status(e.message, true); }
}
function renderEndpoints() {
  const q = $("#efilter").value.trim().toLowerCase();
  const rows = endpoints.filter((e) => !q || [e.id, e.name, e.url, ...(e.models ?? [])].join(" ").toLowerCase().includes(q));
  const { k, d } = esort, key = (e) => k === "models" ? (e.models ?? []).length : e[k];
  rows.sort((a, b) => { const x = key(a), y = key(b); return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * d; });
  $("#ecount").textContent = `${rows.length}/${endpoints.length} · ${rows.reduce((s, e) => s + (e.catalog_tuples || 0), 0)} tuples`;
  $("#etb").innerHTML = rows.map((e) => `<tr data-id="${esc(e.id)}"><td class="t">${esc(e.name)}</td><td class="t">${esc(e.id)}</td>
    <td class="${e.catalog_tuples ? "" : "no"}">${e.catalog_tuples}</td><td>${(e.models ?? []).length}</td><td class="t" title="${esc(e.url)}">${esc(e.url)}</td></tr>`).join("");
}
$("#efilter").oninput = renderEndpoints;
document.querySelectorAll("#v-endpoints th[data-k]").forEach((th) => th.onclick = () => {
  esort = { k: th.dataset.k, d: esort.k === th.dataset.k ? -esort.d : (th.dataset.k === "catalog_tuples" || th.dataset.k === "models" ? -1 : 1) };
  renderEndpoints();
});
$("#etb").onclick = (ev) => {
  const tr = ev.target.closest("tr[data-id]");
  if (!tr) return;
  if (tr.nextElementSibling?.classList.contains("x")) { tr.nextElementSibling.remove(); return; }
  const e = endpoints.find((x) => x.id === tr.dataset.id);

};

// --- SSE reader shared by the live tail and the playground ---
async function* sseBlocks(res, signal) {
  const rd = res.body.pipeThrough(new TextDecoderStream()).getReader();
  signal?.addEventListener("abort", () => rd.cancel().catch(() => {}), { once: true });
  let buf = "";
  for (;;) {
    const { value, done } = await rd.read();
    if (done) break;
    buf += value;
    for (let i = buf.indexOf("\n\n"); i >= 0; i = buf.indexOf("\n\n")) {
      const block = buf.slice(0, i);
      buf = buf.slice(i + 2);
      const data = block.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trimStart()).join("\n");
      yield { data, comment: block.startsWith(":") ? block.slice(1).trim() : null };
    }
  }
}

// --- Traces ---
const TMAX = 300;
const traces = new Map(); // id -> Map(spanId -> span)
let tsel = null, tliveCtl = null, tdirty = false;
const OUT_COLOR = { won: "#d4ff00", failed: "#ff5c5c", timeout: "#ffb547", late: "#6b6f63", cancelled: "#3a3f43" };
const spanColor = (s) => OUT_COLOR[s.attrs.outcome] ?? (s.status === "error" ? "#ff5c5c" : s.end === null ? "#7cc4ff" : s.status === "ok" ? "#a3a79a" : "#6b6f63");
function upsert(id, span) {
  let t = traces.get(id);
  if (!t) {
    t = new Map();
    traces.set(id, t);
    while (traces.size > TMAX) traces.delete(traces.keys().next().value);
  }
  t.set(span.id, span);
  if (!tdirty) { tdirty = true; requestAnimationFrame(renderTraces); }
}
function rootOf(t) { for (const s of t.values()) if (!t.has(s.parent)) return s; }
function renderTraces() {
  tdirty = false;
  const q = $("#tfilter").value.trim().toLowerCase(), errOnly = $("#terr").checked;
  const rows = [];
  for (const [id, t] of [...traces].reverse()) {
    const r = rootOf(t);
    if (!r) continue;
    const errs = [...t.values()].filter((s) => s.status === "error" && s.name === "attempt").length;
    if (errOnly && r.status !== "error") continue;
    const tuple = r.attrs.tuple ?? "";
    if (q && ![id, r.name, r.attrs["model.requested"], r.attrs.mode, tuple].join(" ").toLowerCase().includes(q)) continue;
    const dur = (r.end ?? Date.now()) - r.start;
    rows.push(`<div class="it" role="option" data-id="${id}" aria-current="${id === tsel}"><span class="dot" style="background:${spanColor(r)}"></span>
      <div>${esc(r.name)} <span style="color:var(--mid)">${esc(r.attrs["model.requested"] ?? "")}</span> ${esc(r.attrs.mode ?? "")}<small>${esc(tuple || r.attrs.error || id)}</small></div>
      <div style="text-align:right">${ms(dur)}<small>${t.size} spans ${errs ? `<span class="no">${errs}✗</span>` : ""}</small></div></div>`);
  }
  $("#tlist").innerHTML = rows.join("");
  $("#tcount").textContent = `${rows.length}/${traces.size}`;
  if (tsel) renderWaterfall(tsel);
}
function renderWaterfall(id) {
  const t = traces.get(id);
  if (!t) return;
  const spans = [...t.values()], root = rootOf(t);
  const t0 = Math.min(...spans.map((s) => s.start));
  const t1 = Math.max(t0 + 1, ...spans.map((s) => s.end ?? Date.now()), ...spans.flatMap((s) => s.events.map((e) => e.t)));
  const W = t1 - t0, kids = new Map();
  for (const s of spans) { const p = s === root ? null : s.parent; kids.set(p, [...(kids.get(p) ?? []), s]); }
  const order = [];
  const walk = (p, d) => { for (const s of (kids.get(p) ?? []).sort((a, b) => a.start - b.start)) { order.push([s, d]); walk(s.id, d + 1); } };
  walk(null, 0);
  const pct = (x) => ((x - t0) / W * 100).toFixed(3) + "%";
  $("#wf").innerHTML = `<div class="ax"><div class="l">${esc(id)}</div><div><span>0</span><span>${ms(W / 2)}</span><span>${ms(W)}</span></div></div>` +
    order.map(([s, d]) => {
      const label = s.name === "attempt" ? (s.attrs.tuple ?? s.attrs.backend ?? "") : s.name === "tier" ? `${s.attrs.tier} ${s.attrs.label}` : s.name;
      const tail = s.attrs.outcome ?? (s.end === null ? "…" : "");
      const tip = Object.entries(s.attrs).map(([k, v]) => `${k}=${v}`).join("\n");
      return `<div class="r" data-sid="${s.id}" title="${esc(tip)}"><div class="l" style="padding-left:${8 + d * 12}px"><i>${esc(tail)} ${ms((s.end ?? Date.now()) - s.start)}</i> ${esc(label)}</div>
        <div class="tr"><span class="b" style="left:${pct(s.start)};width:${(((s.end ?? Date.now()) - s.start) / W * 100).toFixed(3)}%;background:${spanColor(s)}"></span>${s.events.map((e) => `<span class="ev" style="left:${pct(e.t)}" title="${esc(e.name + " " + JSON.stringify(e.attrs ?? {}))}"></span>`).join("")}</div></div>`;
    }).join("");
}
async function loadTraces() {
  try {
    const j = await call("/v1/traces?limit=100", { admin: true });
    for (const s of j.data.reverse()) {
      const full = await call("/v1/traces/" + s.id, { admin: true }).catch(() => null);
      for (const sp of full?.spans ?? [s.root]) upsert(s.id, sp);
    }
    renderTraces();
  } catch (e) { status(e.message, true); }
}
async function toggleLive() {
  const btn = $("#tlive");
  if (tliveCtl) { tliveCtl.abort(); tliveCtl = null; btn.setAttribute("aria-pressed", "false"); btn.style.background = ""; return; }
  tliveCtl = new AbortController();
  btn.setAttribute("aria-pressed", "true"); btn.style.background = "#d4ff0018";
  try {
    const res = await fetch("/v1/traces/live", { headers: headers(true), signal: tliveCtl.signal });
    if (!res.ok) throw new Error(`${res.status} ${(await res.json().catch(() => ({})))?.error?.message ?? ""}`);
    for await (const { data } of sseBlocks(res, tliveCtl.signal)) {
      if (!data) continue;
      const e = JSON.parse(data);
      upsert(e.trace, e.span);
    }
  } catch (e) { if (e.name !== "AbortError") status("live: " + e.message, true); }
  if (tliveCtl) toggleLive();
}
$("#tlive").onclick = toggleLive;
$("#tload").onclick = loadTraces;
$("#tfilter").oninput = renderTraces;
$("#terr").onchange = renderTraces;
$("#tlist").onclick = (ev) => {
  const it = ev.target.closest("[data-id]");
  if (!it) return;
  tsel = it.dataset.id; $("#tattrs").hidden = true; renderTraces();
};
$("#wf").onclick = (ev) => {
  const r = ev.target.closest("[data-sid]");
  if (!r) return;
  const s = traces.get(tsel)?.get(r.dataset.sid);
  const pre = $("#tattrs"); pre.hidden = false; pre.textContent = JSON.stringify(s, null, 2);
};
function openTrace(id) {
  tsel = id;
  document.querySelector('nav [data-v="traces"]').click();
  call("/v1/traces/" + id, { admin: true }).then((t) => { for (const s of t.spans) upsert(id, s); renderTraces(); }).catch((e) => status(e.message, true));
}

// --- Playground ---
const PRESET = [
  { type: "function", function: { name: "get_weather", description: "Current weather for a city", parameters: { type: "object", properties: { city: { type: "string" } }, required: ["city"] } } },
  { type: "function", function: { name: "get_time", description: "Current time in an IANA timezone", parameters: { type: "object", properties: { tz: { type: "string" } }, required: ["tz"] } } },
];
$("#ppreset").onclick = () => {
  $("#ptools").value = JSON.stringify(PRESET, null, 2);
  $("#pparallel").checked = true;
  if (!$("#pmsg").value.trim()) $("#pmsg").value = "What is the weather in Paris and the time in Tokyo? Call both tools at once.";
};
let pctl = null;
$("#pstop").onclick = () => pctl?.abort();
$("#pgo").onclick = async () => {
  let tools;
  try { tools = $("#ptools").value.trim() ? JSON.parse($("#ptools").value) : undefined; }
  catch (e) { status("tools: " + e.message, true); return; }
  const messages = [...($("#psys").value.trim() ? [{ role: "system", content: $("#psys").value }] : []), { role: "user", content: $("#pmsg").value || "ping" }];
  const stream = $("#pstream").checked;
  const body = { model: $("#pmodel").value.trim() || "free:auto", messages, stream,
    ...($("#peffort").value ? { reasoning_effort: $("#peffort").value } : {}),
    ...(tools ? { tools, parallel_tool_calls: $("#pparallel").checked } : {}) };
  const rs = $("#preason"), ct = $("#pcontent"), tc = $("#ptcalls"), met = $("#pmet");
  rs.textContent = ""; ct.textContent = ""; tc.hidden = true;
  const m = { t0: performance.now(), hdr: 0, ttft: 0, total: 0, chunks: 0, trace: "", tuple: "", finish: "" };
  const show = () => {
    met.innerHTML = [["headers", ms(m.hdr)], ["ttft", ms(m.ttft || NaN)], ["total", ms(m.total || NaN)], ["chunks", m.chunks], ["finish", esc(m.finish || "—")], ["tuple", esc(m.tuple || "—")]]
      .map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join("") + (m.trace ? `<a href="#" id="ptrace">trace</a>` : "");
    const a = $("#ptrace"); if (a) a.onclick = (ev) => { ev.preventDefault(); openTrace(m.trace); };
  };
  const calls = [];
  const addCalls = (list) => {
    for (const t of list ?? []) {
      const c = calls[t.index] ??= { id: t.id, type: t.type, function: { name: "", arguments: "" } };
      if (t.id) c.id = t.id;
      c.function.name += t.function?.name ?? "";
      c.function.arguments += t.function?.arguments ?? "";
    }
    if (calls.length) { tc.hidden = false; tc.textContent = JSON.stringify(calls.map((c) => { try { return { ...c, function: { ...c.function, arguments: JSON.parse(c.function.arguments) } }; } catch { return c; } }), null, 2); }
  };
  pctl = new AbortController();
  $("#pgo").disabled = true; $("#pstop").disabled = false;
  try {
    const res = await fetch("/v1/chat/completions", { method: "POST", headers: headers(false), body: JSON.stringify(body), signal: pctl.signal });
    m.hdr = performance.now() - m.t0;
    m.trace = (res.headers.get("traceparent") ?? "").split("-")[1] ?? "";
    show();
    if (!res.ok) throw new Error(`${res.status} ${(await res.json().catch(() => ({})))?.error?.message ?? ""}`);
    if (!stream) {
      const j = await res.json();
      const msg = j.choices?.[0]?.message ?? {};
      m.total = performance.now() - m.t0; m.ttft = j.telemetry?.observed_ttft_ms ?? NaN; m.finish = j.choices?.[0]?.finish_reason; m.tuple = j.nokey?.tuple_id ?? "";
      rs.textContent = msg.reasoning_content ?? ""; ct.textContent = msg.content ?? "";
      addCalls((msg.tool_calls ?? []).map((t, i) => ({ ...t, index: i })));
    } else {
      for await (const { data, comment } of sseBlocks(res, pctl.signal)) {
        if (comment) { status(comment); continue; }
        if (!data || data === "[DONE]") continue;
        const j = JSON.parse(data);
        if (j.error) throw new Error(j.error.message);
        const d = j.choices?.[0]?.delta ?? {};
        m.chunks++;
        if (!m.ttft && (d.content || d.reasoning_content || d.tool_calls)) m.ttft = performance.now() - m.t0;
        if (d.reasoning_content) rs.textContent += d.reasoning_content;
        if (d.content) ct.textContent += d.content;
        if (d.tool_calls) addCalls(d.tool_calls);
        if (j.choices?.[0]?.finish_reason) m.finish = j.choices[0].finish_reason;
        if (j.nokey) m.tuple = j.nokey.tuple_id ?? (j.nokey.degraded ? "degraded" : "");
        show();
      }
      m.total = performance.now() - m.t0;
    }
    status("done");
  } catch (e) { status(e.name === "AbortError" ? "stopped" : e.message, e.name !== "AbortError"); }
  show();
  $("#pgo").disabled = false; $("#pstop").disabled = true; pctl = null;
};

});
addEventListener("resize", () => health && lanes(health));

pollHealth(); schedule();
